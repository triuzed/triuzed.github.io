<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triuzed — портфолио</title>
<meta name="description" content="Портфолио Triuzed — 3D комната с аквариумом, лава-лампой и старым телевизором. P2P мессенджер Skyle.">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a2b33'/%3E%3Cpath d='M6 16c4-5 10-5 14 0-4 5-10 5-14 0z' fill='%237fd8ff'/%3E%3Cpath d='M20 16l6-4v8z' fill='%237fd8ff'/%3E%3Ccircle cx='10.5' cy='15' r='1.2' fill='%23081218'/%3E%3C/svg%3E">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0a12}
#p3d-boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:#0d0a12;color:#7fd8ff;font-family:system-ui,sans-serif;font-size:14px;letter-spacing:3px;text-transform:uppercase;text-align:center;padding:24px;z-index:9}
#p3d-boot small{color:rgba(215,228,255,.5);font-size:12px;letter-spacing:.3px;text-transform:none;max-width:460px;line-height:1.55}
#p3d-boot small b{color:#ffb3a8;font-weight:600}
#p3d-boot .spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(127,216,255,.2);border-top-color:#7fd8ff;animation:p3dspin 1s linear infinite}
#p3d-boot.err{color:#ffb3a8}
#p3d-boot.err .spin{display:none}
@keyframes p3dspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="p3d-boot"><div class="spin"></div><div>Загрузка комнаты</div><small>Если загрузка не закончилась — проверь интернет или открой лёгкую версию сайта без 3D.</small></div>
<noscript><div style="position:fixed;inset:0;background:#0d0a12;color:#eaf6ff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:24px">Для 3D-версии нужен JavaScript 🙃</div></noscript>
<script>
(function () {
  function fail(html) {
    if (window.__p3dBooted) return;
    var b = document.getElementById('p3d-boot');
    if (!b) return;
    b.classList.add('err');
    b.innerHTML = html;
  }
  // Реальные ошибки выполнения/парсинга скрипта (ErrorEvent всегда несёт message).
  // События загрузки ресурсов (img/script/link) — обычные Event без message, их пропускаем:
  // отсутствие profile.png не должно пугать пользователя фальшивой ошибкой.
  window.addEventListener('error', function (ev) {
    if (window.__p3dBooted || !ev || (!ev.message && !ev.error)) return;
    var m = ev.message || (ev.error && ev.error.message) || 'неизвестная ошибка';
    var pos = ev.lineno ? (' (строка ~' + ev.lineno + ')') : '';
    fail('<div>3D-комната не запустилась :(</div><small>Ошибка скрипта: <b>' + m + pos + '</b><br><br>Чаще всего файл сайта повреждается при заливке на хостинг — перезалей <b>index.html</b> через «Add file &rarr; Upload files», не копируя текст руками.</small>');
  }, true);
  window.addEventListener('unhandledrejection', function (ev) {
    if (window.__p3dBooted) return;
    var r = ev && ev.reason;
    fail('<div>3D-комната не запустилась :(</div><small>Ошибка: <b>' + String((r && r.message) || r || 'promise') + '</b><br><br>Перезагрузи страницу — обычно помогает.</small>');
  });
  window.__p3dBoot = setTimeout(function () {
    fail('<div>3D-комната не запустилась :(</div><small>Скрипт не ответил за 9 секунд. Проверь интернет и перезагрузи страницу, либо открой лёгкую версию сайта без 3D.</small>');
  }, 9000);
})();
</script>

.p3d{position:fixed;inset:0;overflow:hidden;background:#0d0a12;font-family:'Rubik',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.p3d *{box-sizing:border-box}
.p3d canvas{display:block}
.p3d-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(5,3,10,.6) 100%);z-index:2}
.p3d-welcome{position:absolute;top:5.5vh;left:0;right:0;text-align:center;z-index:4;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
.p3d-welcome h1{font-weight:900;font-size:clamp(22px,3.6vw,44px);color:#eaf6ff;letter-spacing:.5px;margin:0;text-shadow:0 0 18px rgba(127,216,255,.55),0 0 64px rgba(127,216,255,.28)}
.p3d-welcome h1 span{color:#7fd8ff}
.p3d-hint{margin-top:13px;color:rgba(215,228,255,.62);font-size:clamp(12px,1.35vw,16px);letter-spacing:.4px}
.p3d-hint b{color:#ffd28a;font-weight:500}
.p3d-welcome.p3d-hidden{opacity:0;transform:translateY(-16px)}
.p3d-strip{position:absolute;top:0;bottom:0;width:14%;min-width:96px;z-index:3;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s ease,background .3s ease;cursor:pointer}
.p3d-strip-l{left:0;background:linear-gradient(to right,rgba(127,216,255,.09),transparent)}
.p3d-strip-r{right:0;background:linear-gradient(to left,rgba(255,170,90,.09),transparent)}
.p3d-strip.p3d-show{opacity:1;pointer-events:auto}
.p3d-strip-l.p3d-show:hover{background:linear-gradient(to right,rgba(127,216,255,.22),transparent)}
.p3d-strip-r.p3d-show:hover{background:linear-gradient(to left,rgba(255,170,90,.22),transparent)}
.p3d-strip span{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(230,240,255,.85);border:1px solid rgba(230,240,255,.28);padding:9px 16px;border-radius:999px;background:rgba(10,8,18,.35);backdrop-filter:blur(3px);white-space:nowrap}
.p3d-proj{position:absolute;left:0;top:0;transform-origin:0 0;z-index:5;opacity:0;pointer-events:none;transition:opacity .45s ease}
.p3d-proj.p3d-visible{opacity:1;pointer-events:auto}
.p3d-crt{width:100%;height:100%;background:radial-gradient(115% 115% at 50% 42%,#133826 0%,#0a2016 55%,#050f0a 100%);border-radius:24px;color:#c8ffd6;font-family:'PT Mono','Courier New',monospace;padding:26px 28px;display:flex;flex-direction:column;box-shadow:inset 0 0 70px rgba(0,0,0,.78),inset 0 0 14px rgba(140,255,180,.14);position:relative;overflow:hidden}
.p3d-crt::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);pointer-events:none;border-radius:24px}
.p3d-crt::before{content:'';position:absolute;inset:0;background:radial-gradient(85% 65% at 50% 45%,transparent 58%,rgba(0,0,0,.38) 100%);pointer-events:none}
.p3d-crt-row{display:flex;gap:22px;align-items:flex-start;position:relative;z-index:1}
.p3d-avatar{width:118px;height:118px;object-fit:cover;border:2px solid #57d98f;border-radius:10px;flex:0 0 auto;background:#0a1a12;filter:saturate(.92)}
.p3d-crt h2{font-size:29px;letter-spacing:4px;color:#aaffcc;text-shadow:0 0 14px rgba(90,255,150,.75);margin:2px 0 12px}
.p3d-crt p{font-size:14.5px;line-height:1.55;color:#b9eec6;margin:0}
.p3d-crt p+p{margin-top:9px}
.p3d-tvoff{margin-top:auto;align-self:center;font-family:inherit;font-size:15px;letter-spacing:3px;color:#ffb3a8;background:rgba(120,30,20,.22);border:1px solid #a0453a;border-radius:9px;padding:11px 34px;cursor:pointer;transition:all .25s;position:relative;z-index:1}
.p3d-tvoff:hover{background:rgba(170,48,30,.5);color:#fff;box-shadow:0 0 20px rgba(255,90,70,.45)}
.p3d-note{width:100%;height:100%;background:#f7f0da;border-radius:4px;color:#27356b;font-family:'Caveat','Comic Sans MS',cursive;padding:24px 30px 18px;display:flex;flex-direction:column;overflow:hidden}
.p3d-note h3{font-size:39px;font-weight:700;color:#1e2a56;line-height:1.05;margin:0 0 10px}
.p3d-note a{font-size:28px;line-height:1.25;color:#27356b;text-decoration:none;border-bottom:2px dashed rgba(39,53,107,.45);width:fit-content;transition:all .2s}
.p3d-note a:hover{color:#0a1f8f;background:rgba(58,90,220,.13);border-bottom-style:solid}
.p3d-nspan{font-size:24px;color:#5a6590;line-height:1.3}
.p3d-tail{margin-top:auto;align-self:flex-end;font-size:26px;color:#8a6a3a}
.p3d-back{position:absolute;left:50%;bottom:4.5vh;transform:translateX(-50%);z-index:6;font-family:'Rubik',sans-serif;font-size:15px;letter-spacing:1.2px;color:#f0d9b0;background:rgba(24,17,30,.82);border:1px solid rgba(201,162,39,.5);border-radius:999px;padding:12px 32px;cursor:pointer;opacity:0;pointer-events:none;transition:all .35s;backdrop-filter:blur(6px)}
.p3d-back.p3d-visible{opacity:1;pointer-events:auto}
.p3d-back:hover{border-color:#c9a227;color:#fff;box-shadow:0 0 22px rgba(201,162,39,.35)}
.p3d-loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:#0d0a12;z-index:10;color:#7fd8ff;font-size:14px;letter-spacing:3px;transition:opacity .8s;text-transform:uppercase}
.p3d-loading::before{content:'';width:34px;height:34px;border-radius:50%;border:2px solid rgba(127,216,255,.2);border-top-color:#7fd8ff;animation:p3dspin 1s linear infinite}
@keyframes p3dspin{to{transform:rotate(360deg)}}
.p3d-loading.p3d-hidden{opacity:0;pointer-events:none}
.p3d-err{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;background:#0d0a12;color:#7fd8ff;font-family:inherit;font-size:15px;letter-spacing:.5px;padding:24px;line-height:1.5}
.p3d-err.p3d-errshow{display:flex}
.p3d-err small{color:rgba(215,228,255,.55);font-size:12.5px;letter-spacing:.3px;max-width:440px}
.p3d-err button{font:inherit;color:#0d0a12;background:#7fd8ff;border:0;border-radius:999px;padding:10px 24px;cursor:pointer;margin-top:4px}
